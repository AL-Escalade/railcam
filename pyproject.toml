[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railcam"
version = "0.1.0"
description = "CLI tool to generate cropped videos from climbing footage, tracking the climber's pelvis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ghusse" }
]
keywords = ["climbing", "speed-climbing", "video", "pose-estimation", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
]

[project.scripts]
railcam = "railcam.cli:main"
railcam-gui = "railcam.gui.app:main"

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Qt APIs impose camelCase method overrides (N802) and signal names (N815)
"src/railcam/gui/*" = ["N802", "N815"]

[tool.mypy]
# Not the minimum supported runtime (requires-python is >=3.9): mypy 2.x refuses
# targets below 3.10, and numpy's stubs use PEP 695 `type` statements that only
# parse when the target is 3.12+, which otherwise aborts the whole run.
# 3.9 compatibility is covered by ruff's target-version and by the CI test matrix.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
